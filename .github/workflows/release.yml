name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Zip
        run: |
          ditto -c -k --keepParent "build/Air Traffic.app" "Air-Traffic-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Air-Traffic-${GITHUB_REF_NAME}.zip" > "Air-Traffic-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### Install
          1. Download **Air-Traffic-*.zip** below, unzip, move **Air Traffic** to `/Applications`.
          2. Open it. macOS says it can't verify the developer (the app isn't notarized yet):
             open **System Settings → Privacy & Security**, scroll down, click **Open Anyway**.
             Or in Terminal: `xattr -dr com.apple.quarantine "/Applications/Air Traffic.app"`
          3. In Air Traffic's settings, click **Make Default**.

          Requires macOS 26 or later (Apple silicon and Intel).
          NOTES
          gh release create "$GITHUB_REF_NAME" Air-Traffic-*.zip* \
            --title "Air Traffic ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes --verify-tag
