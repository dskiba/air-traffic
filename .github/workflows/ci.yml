name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Air Traffic
          path: build/Air Traffic.app
